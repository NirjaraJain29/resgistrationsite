<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | TechFest 2025</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <header>
    <h1>Register for TechFest 2025</h1>
    <p>Fill out the form below to secure your spot!</p>
  </header>

  <section>
    <form id="registrationForm">
      <label>Full Name:</label>
      <input type="text" id="name" required>

      <label>Email:</label>
      <input type="email" id="email" required>

      <label>Phone:</label>
      <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10-digit number">

      <label>Event Type:</label>
      <select id="eventType" required>
        <option value="">-- Select Event --</option>
        <option value="Workshop">Workshop</option>
        <option value="Webinar">Webinar</option>
        <option value="Hackathon">Hackathon</option>
      </select>

      <label>Gender:</label>
      <div class="gender">
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
      </div>

      <label>
        <input type="checkbox" id="agree" required> I agree to the terms and conditions
      </label>

      <button type="submit">Submit</button>
    </form>
  </section>

  <a href="index.html" class="back-btn">← Back to Home</a>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const eventType = document.getElementById("eventType").value;
      const gender = document.querySelector('input[name="gender"]:checked').value;

      if (!document.getElementById("agree").checked) {
        alert("Please agree to the terms and conditions!");
        return;
      }

      const participant = { name, email, phone, eventType, gender };

      // Save to localStorage
      const participants = JSON.parse(localStorage.getItem("participants")) || [];
      participants.push(participant);
      localStorage.setItem("participants", JSON.stringify(participants));

      // Redirect to Thank You page with name as URL parameter
      window.location.href = `thankyou.html?name=${encodeURIComponent(name)}`;
    });
  </script>
<script>
  const themeButton = document.createElement("button");
  themeButton.className = "theme-toggle";
  themeButton.title = "Toggle theme";
  themeButton.textContent = "🌓";
  document.querySelector("header").appendChild(themeButton);

  // Load saved theme
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark") document.body.classList.add("dark");

  // Toggle theme
  themeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const theme = document.body.classList.contains("dark") ? "dark" : "light";
    localStorage.setItem("theme", theme);
  });
</script>

</body>
</html>
